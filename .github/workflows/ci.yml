name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      # `uv sync` also installs the `dev` dependency group (httpx, needed by
      # FastAPI's TestClient), so no separate --dev flag is required.
      - name: Install dependencies
        run: uv sync --frozen

      # The unit test suite (tests/) never touches a real database or the
      # OpenAI API - DATABASE_URL/OPENAI_API_KEY are stubbed inside
      # tests/test_api_routes.py before app.main is imported, and every
      # LLM/DB call is mocked. So this step needs no secrets at all.
      - name: Run unit tests
        run: uv run python -m unittest discover

      # week6/evaluations/run_evaluation.py is a different kind of check: it
      # boots the real FastAPI app against a real Postgres+pgvector database
      # and drives POST /ask/ end-to-end, spending real OpenAI credits per
      # question. That only makes sense against a dedicated staging DB, never
      # production - so it's opt-in via repo secrets, not a hard CI
      # dependency.
      - name: Run RAG evaluation harness against staging
        if: ${{ vars.HAS_STAGING_DB == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8001/health/ && break
            sleep 1
          done
          uv run python -m week6.evaluations.run_evaluation \
            --base-url http://localhost:8001 \
            --minimum-accuracy 0.8

      - name: Skip evaluation harness (no staging instance configured)
        if: ${{ vars.HAS_STAGING_DB != 'true' }}
        run: |
          echo "Skipping week6/evaluations/run_evaluation.py: no staging DB is wired up for CI."
          echo ""
          echo "This harness needs a real Postgres+pgvector instance with indexed news_items"
          echo "and spends OpenAI credits per question (30 questions x embedding + gpt-4o-mini"
          echo "call), so it intentionally does not run against production and is not a hard"
          echo "requirement for this repo's CI to pass."
          echo ""
          echo "To enable it: set the STAGING_DATABASE_URL and OPENAI_API_KEY repo secrets,"
          echo "and set the HAS_STAGING_DB repo/environment variable to 'true'."
          echo ""
          echo "To run it yourself locally instead:"
          echo "  uv run uvicorn app.main:app --port 8001 &"
          echo "  uv run python -m week6.evaluations.run_evaluation --base-url http://localhost:8001"
