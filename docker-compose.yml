services:
  db:
    image: pgvector/pgvector:pg17   # plain Postgres + vector extension (needed in week 4)
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .

volumes:
  postgres_data: